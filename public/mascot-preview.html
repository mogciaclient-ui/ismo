<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ismo. mascot preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:46px;background:#f6f6f8;color:#24242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1080px;margin:auto}.eyebrow{color:#ff647c;font-size:10px;font-weight:700;letter-spacing:.18em}h1{margin:8px 0 7px;font-size:32px}header p{margin:0 0 28px;color:#797b83;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:400px;padding:25px;border:1px solid #e5e5e9;border-radius:18px;background:#fff;box-shadow:0 14px 34px #1c1d2210}.card>span{color:#a1a2a8;font-size:9px;letter-spacing:.14em}.card h2{margin:8px 0 5px;font-size:17px}.card>p{margin:0;color:#7c7e85;font-size:11px;line-height:1.7}.stage{display:grid;height:250px;place-items:center}.stage img{width:175px;height:175px;object-fit:contain;filter:drop-shadow(0 14px 20px #ff647c22)}.float img{animation:float 2.3s ease-in-out infinite}.dark{color:#fff;background:#202126;border-color:#202126}.dark>p{color:#9fa1a9}.ai-box{position:relative;min-height:150px;margin-top:30px;padding:25px 20px 20px 138px;overflow:hidden;border-radius:14px;background:#292a30}.ai-box img{position:absolute;bottom:-8px;left:5px;width:135px;height:135px;object-fit:contain}.ai-box b{font-size:13px}.ai-box p{color:#b3b5bc;font-size:10px;line-height:1.8}.button{display:inline-block;margin-top:17px;padding:10px 14px;border-radius:8px;background:#ff647c;color:#fff;font-size:10px;font-weight:700}.loader-copy{text-align:center}.loader-copy b{display:block;font-size:10px;letter-spacing:.14em}.loader-copy i{color:#ff647c;font-style:normal}.loader-copy small{display:block;margin-top:7px;color:#92949b}.renewal{text-align:center}.renewal img{width:165px;height:165px}.renewal h3{margin:0;font-size:16px}.renewal p{color:#777982;font-size:10px;line-height:1.7}@keyframes float{50%{transform:translateY(-7px) rotate(1deg)}}@media(max-width:800px){body{padding:24px}.grid{grid-template-columns:1fr}.card{min-height:340px}}
  </style>
</head>
<body><main class="wrap"><header><span class="eyebrow">MASCOT UI TEST</span><h1>ismo. cat preview</h1><p>プロダクトへ試しに入れた3つの使い方です。</p></header><div class="grid"><section class="card dark"><span>LOADING</span><h2>データを読み解いています</h2><p>ページ全体・AI処理中の待ち時間に表示。</p><div class="stage float"><div><img src="/mascots/ismo-cat-loader.png" alt="上を見る猫"><div class="loader-copy"><b>SEE WHAT OTHERS MISS<i>.</i></b><small>サイトの状態を読み解いています</small></div></div></div></section><section class="card dark"><span>AI ANALYSIS</span><h2>分析のおとも</h2><p>AI分析の対象データを案内するカード。</p><div class="ai-box"><img src="/mascots/ismo-cat-ai.png" alt="PCを操作する猫"><div><b>分析対象</b><p>認証済みサイトの直近30日<br>集計値のみAIへ送信</p></div></div></section><section class="card"><span>RENEWAL</span><h2>診断を始める前に</h2><p>機能の入口になる空状態で表示。</p><div class="stage renewal"><div><img src="/mascots/ismo-cat-renewal.png" alt="グラフを見る猫"><h3>今ある価値を見つけます。</h3><p>残す・直す・追加するを整理します。</p><span class="button">診断を始める</span></div></div></section></div></main></body>
</html>
